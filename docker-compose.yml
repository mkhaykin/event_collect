version: "3.9"

services:
  db:
    image: postgres:15.1-alpine
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
    ports:
      - "${POSTGRES_PORT}:5432"
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}" ]
      interval: 5s
      timeout: 10s
      retries: 5
      start_period: 10s

  valkey:
    image: valkey/valkey:8.0-alpine
    container_name: valkey
    environment:
      - VALKEY_ARGS=--maxmemory-policy noeviction
    ports:
      - "${VALKEY_PORT}:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  app_prepare:
    build:
      context: .
      dockerfile: Dockerfile
    restart: no
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    command: /app/prepare/prepare.sh

  device-provider-worker:
    build:
      context: .
      dockerfile: Dockerfile
    command: .venv/bin/python -m taskiq worker apps.device_provider.tasks:broker --log-level DEBUG --no-configure-logging
    depends_on:
      app_prepare:
        condition: service_completed_successfully
    environment:
      - VALKEY_DSN=redis://valkey:6379/0
      - TASKIQ_LOG_LEVEL=DEBUG
    volumes:
      - ./storage:/storage:ro
    links:
      - valkey

  device-provider-scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    command: .venv/bin/python -m taskiq scheduler apps.device_provider.scheduler:scheduler
    depends_on:
      app_prepare:
        condition: service_completed_successfully
      device-provider-worker:
        condition: service_started
      collector:  # временно, из-за гонки в очереди
        condition: service_started
    environment:
      - VALKEY_DSN=redis://valkey:6379/0
      - TASKIQ_LOG_LEVEL=INFO
    links:
      - valkey

  device-poller:
    build:
      context: .
      dockerfile: Dockerfile
    command: .venv/bin/python -m apps.poller.main
#    command: sleep infinity
    depends_on:
      app_prepare:
        condition: service_completed_successfully
      collector:  # временно, из-за гонки в очереди
        condition: service_started
    environment:
      - VALKEY_DSN=redis://valkey:6379/0
    restart: always

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    command: .venv/bin/python -m apps.collector.main
    depends_on:
      app_prepare:
        condition: service_completed_successfully
    environment:
      - VALKEY_DSN=redis://valkey:6379/0
    restart: always

  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: clickhouse-server
    ports:
      - "8123:8123"   # HTTP Interface / Web UI
#      - "9000:9000"   # Native TCP Client
    environment:
      CLICKHOUSE_DB: "${CLICKHOUSE_DB}"
      CLICKHOUSE_USER: "${CLICKHOUSE_USER}"
      CLICKHOUSE_PASSWORD: "${CLICKHOUSE_PASSWORD}"
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "${CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT}"
#    volumes:
#      - clickhouse_data:/var/lib/clickhouse
#      - clickhouse_logs:/var/log/clickhouse-server
      # Optional: Uncomment below if you want to run initial SQL scripts on startup
      # - ./init-db.d:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "clickhouse-client", "--user", "${CLICKHOUSE_USER}", "--password", "${CLICKHOUSE_PASSWORD}", "--query", "SELECT 1" ]
      interval: 3s
      timeout: 3s
      retries: 10
#    ulimits:
#      nofile:
#        soft: 262144
#        hard: 262144
    restart: always

networks:
  default:
    name: lan_event_collect
