<!-- src/apps/web-ui/templates/overview.html -->
{% extends "base.html" %}

{% block content %}
<!-- Наш верхний ряд карточек-виджетов ложится в красивую сетку Flex/Grid -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">

    <!-- Виджет: Доступность устройств -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-5"
         hx-get="/components/availability"
         hx-trigger="load, globalFilterChanged from:body"
         hx-include="#global-filters">
        <!-- Временный скелетон-загрузчик (лоадер) -->
        <div class="animate-pulse flex space-x-4"><div class="flex-1 space-y-4 py-1"><div class="h-4 bg-slate-700 rounded"></div></div></div>
    </div>

    <!-- Виджет: Качество отклика -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-5"
         hx-get="/components/response-quality"
         hx-trigger="load, globalFilterChanged from:body"
         hx-include="#global-filters">
        <div class="animate-pulse flex space-x-4"><div class="flex-1 space-y-4 py-1"><div class="h-4 bg-slate-700 rounded"></div></div></div>
    </div>

    <!-- Виджет: Сбор данных -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-5"
         hx-get="/components/collection-summary"
         hx-trigger="load, globalFilterChanged from:body"
         hx-include="#global-filters">
        <div class="animate-pulse flex space-x-4"><div class="flex-1 space-y-4 py-1"><div class="h-4 bg-slate-700 rounded"></div></div></div>
    </div>
</div>

<!-- Нижний ряд: Тяжелые компоненты (Сетка из двух колонок: Таблица и Алерты) -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">

    <!-- Левая колонка (Занимает 2/3 ширины): Таблица "Все устройства" -->
    <div class="lg:col-span-2 bg-[#1e293b] border border-slate-700 rounded-xl p-6"
         hx-get="/components/device-table"
         hx-trigger="load, globalFilterChanged from:body"
         hx-include="#global-filters">
        <div class="text-slate-400 text-sm animate-pulse">Загрузка реестра хостов...</div>
    </div>

    <!-- График "Детализация сбора" с табами (1/3 ширины) -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-6">

        <div id="collection-details-container">
            <div class="text-slate-400 text-sm animate-pulse">Загрузка деталей сбора...</div>
        </div>

        <!-- НЕВИДИМЫЙ ИНИЦИАЛИЗАТОР: Он срабатывает строго ОДИН РАЗ при загрузке страницы,
             закачивает дефолтный график внутрь слота и засыпает. -->
        <div hx-get="/components/collection-details?tab=periods"
             hx-trigger="load"
             hx-target="#collection-details-container"
             hx-swap="innerHTML"
             class="hidden">
        </div>
    </div>
</div>

<!-- СТРОКА 3: Аналитика, Инциденты и Управление (События по категориям + Последние события + Быстрые действия) -->
<div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-6">
    <!-- События по категориям -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-6">
        <div id="events-categories-container"
             hx-get="/components/events-categories"
             hx-trigger="load"
             hx-swap="innerHTML">
            <div class="text-slate-400 text-sm animate-pulse">Загрузка категорий...</div>
        </div>
    </div>

    <!-- Последние события -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-6"
         hx-get="/components/recent-events"
         hx-trigger="load, globalFilterChanged from:body"
         hx-include="#global-filters">
        <div class="text-slate-400 text-sm animate-pulse">Загрузка ленты инцидентов...</div>
    </div>

    <!-- Панель: Быстрые действия -->
    <div class="bg-[#1e293b] border border-slate-700 rounded-xl p-6 flex flex-col justify-between">
        <div>
            <h3 class="text-base font-semibold text-slate-100 mb-4">Быстрые действия</h3>
            <p class="text-xs text-slate-400 mb-6">Оперативное управление рантаймом системы из веб-интерфейса.</p>

            <div class="space-y-3">
                <!-- Рабочая кнопка: Полная интерактивная перезагрузка страницы через hx-get на корень -->
                <button hx-get="/"
                        hx-target="body"
                        hx-swap="innerHTML"
                        class="w-full bg-sky-600 hover:bg-sky-500 text-white rounded-lg px-4 py-2.5 text-sm font-medium transition shadow-lg shadow-sky-600/10">
                    Обновить данные
                </button>
                <button class="w-full bg-slate-800 text-slate-500 cursor-not-allowed rounded-lg px-4 py-2.5 text-sm font-medium border border-slate-700/50" disabled>
                    Запустить принудительный опрос (Заглушка)
                </button>
                <button class="w-full bg-slate-800 text-slate-500 cursor-not-allowed rounded-lg px-4 py-2.5 text-sm font-medium border border-slate-700/50" disabled>
                    Сбросить кэш чекпоинтов (Заглушка)
                </button>
            </div>
        </div>
        <div class="text-[10px] text-slate-500 text-center mt-4">
            EventMonitor v0.1.0
        </div>
    </div>
</div>

{% endblock %}
