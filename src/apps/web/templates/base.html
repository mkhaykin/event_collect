<!-- src/apps/web/templates/base.html -->
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>EventMonitor — Мониторинг и сбор событий</title>
    <script src="/static/js/htmx.min.js"></script>
    <script src="/static/js/chart.umd.min.js"></script>
    <script src="/static/js/tailwindcss.js"></script>
    <script defer src="/static/js/alpine.min.js"></script>
</head>
<body class="bg-[#0f172a] text-slate-200 min-h-screen flex">

    <!-- Боковое навигационное меню -->
    <aside class="w-64 bg-[#1e293b] border-r border-slate-700 flex flex-col p-4">
        <div class="mb-8 px-2">
            <h1 class="text-xl font-bold text-sky-400">EventMonitor</h1>
            <p class="text-xs text-slate-400">Мониторинг и сбор событий</p>
        </div>
        <nav class="flex-1 space-y-1">
            <a href="/" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Обзор</a>
            <a href="/availability" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Доступность устройств</a>
            <a href="/collection" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Сбор данных</a>
            <a href="/events" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">События</a>
            <a href="/reports" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Отчеты</a>
            <a href="/notifications" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Уведомления</a>
            <a href="/settings" class="block px-4 py-2.5 rounded-lg text-sm font-medium hover:bg-slate-700 transition">Настройки</a>
        </nav>
    </aside>

    <!-- Основной контентный блок -->
    <main class="flex-1 flex flex-col min-w-0">
        <!-- Верхняя панель управления с Глобальными Параметрами -->
        <header class="h-16 bg-[#1e293b] border-b border-slate-700 flex items-center justify-between px-6">
            <h2 class="text-lg font-semibold text-slate-100">Обзор системы</h2>

        <!-- Форма глобальной Машины Времени -->
        <form id="global-filters" class="flex items-center space-x-3" x-data="{ isLive: true, anchorTime: '2026-11-26T19:46' }">

            <!-- Переключатель периодов (Ширина окна) -->
            <div class="bg-[#0f172a] rounded-lg p-0.5 flex border border-slate-700 select-none">
                <label class="px-3 py-1 text-xs font-medium cursor-pointer rounded-md text-slate-400 has-[:checked]:bg-sky-500 has-[:checked]:text-white">
                    <input type="radio" name="global_period" value="1h" class="hidden" onchange="htmx.trigger('body', 'globalFilterChanged')">1 час
                </label>
                <label class="px-3 py-1 text-xs font-medium cursor-pointer rounded-md text-slate-400 has-[:checked]:bg-sky-500 has-[:checked]:text-white">
                    <input type="radio" name="global_period" value="1d" checked class="hidden" onchange="htmx.trigger('body', 'globalFilterChanged')">1 день
                </label>
                <label class="px-3 py-1 text-xs font-medium cursor-pointer rounded-md text-slate-400 has-[:checked]:bg-sky-500 has-[:checked]:text-white">
                    <input type="radio" name="global_period" value="1w" class="hidden" onchange="htmx.trigger('body', 'globalFilterChanged')">1 неделя
                </label>
            </div>

            <!-- Интерактивный Якорь времени -->
            <div class="flex items-center bg-[#0f172a] border border-slate-700 rounded-lg px-2 py-1 space-x-2">
                <!-- Кнопка фиксации Live-режима (Переключатель Сейчас / Архив) -->
                <button type="button"
                        @click="isLive = !isLive; if(isLive) { htmx.trigger('body', 'globalFilterChanged') }"
                        :class="isLive ? 'bg-emerald-500/10 text-emerald-400 border-emerald-500/20' : 'bg-amber-500/10 text-amber-400 border-amber-500/20'"
                        class="px-2 py-0.5 text-[10px] font-bold uppercase rounded border transition">
                    <span x-text="isLive ? 'Live' : 'Архив'"></span>
                </button>

                <!-- Поле ввода даты И времени. Блокируется, если включен режим Live (Текущее время) -->
                <input type="datetime-local"
                       name="global_anchor"
                       x-model="anchorTime"
                       :disabled="isLive"
                       :class="isLive ? 'opacity-40 cursor-not-allowed' : 'opacity-100 focus:border-sky-500'"
                       class="bg-transparent text-xs font-medium text-slate-300 focus:outline-none border-none p-0"
                       onchange="htmx.trigger('body', 'globalFilterChanged')">

                <!-- Скрытое поле, передающее флаг режима в API -->
                <input type="hidden" name="global_is_live" :value="isLive ? '1' : '0'">
            </div>
        </form>

        </header>

        <!-- Рабочая зона страницы -->
        <div class="p-6 overflow-y-auto flex-1">
            {% block content %}{% endblock %}
        </div>
    </main>

</body>
</html>
