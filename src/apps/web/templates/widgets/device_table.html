<!-- src/apps/web_ui/templates/widgets/device_table.html -->
<h3 class="text-base font-semibold text-slate-100 mb-4">Состояние устройств в пуле</h3>
<div class="overflow-x-auto">
    <table class="w-full text-left border-collapse">
        <thead>
            <tr class="border-b border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider">
                <th class="pb-3">Имя (UID)</th>
                <th class="pb-3">IP Адрес</th>
                <th class="pb-3">Отклик</th>
                <th class="pb-3">Аптайм</th>
                <th class="pb-3">Последний опрос</th>
                <th class="pb-3 text-right">Статус</th>
            </tr>
        </thead>
        <tbody class="divide-y divide-slate-800 text-sm">
            {% for dev in devices %}
            <tr>
                <td class="py-3.5 font-medium text-white">{{ dev.uid }}</td>
                <td class="py-3.5 text-slate-400">{{ dev.ip }}</td>
                <td class="py-3.5 text-slate-300">{{ dev.ping }}</td>
                <td class="py-3.5 text-slate-400">{{ dev.uptime }}</td>
                <td class="py-3.5 text-slate-500 font-mono text-xs">{{ dev.last_check }}</td>
                <td class="py-3.5 text-right">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-{{ dev.status_color }}-500/10 text-{{ dev.status_color }}-400 border border-{{ dev.status_color }}-500/20">
                        {{ dev.status }}
                    </span>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
