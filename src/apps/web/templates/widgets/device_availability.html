<!-- src/apps/web/templates/widgets/device_availability.html -->
<div class="flex items-center justify-between mb-4">
    <h3 class="text-sm font-medium text-slate-400">Доступность устройств</h3>
</div>
<div class="flex items-center space-x-6">
    <div>
        <span class="text-4xl font-bold tracking-tight text-white">{{ total_devices }}</span>
        <p class="text-xs text-slate-400 mt-1">Всего устройств</p>
    </div>
    <div class="flex-1 space-y-2">
        <div class="flex items-center text-xs justify-between"><span class="text-emerald-400">Онлайн: {{ online_count }}</span><span class="text-slate-400">{{ online_pct }}%</span></div>
        <div class="flex items-center text-xs justify-between"><span class="text-rose-400">Оффлайн: {{ offline_count }}</span><span class="text-slate-400">{{ offline_pct }}%</span></div>
    </div>
</div>
