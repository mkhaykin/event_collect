<!-- src/apps/web_ui/templates/widgets/collection_details.html -->
<div class="flex flex-col h-full justify-between">
    <div>
        <div class="flex items-center justify-between mb-4">
            <h3 class="text-base font-semibold text-slate-100">Детализация сбора</h3>
        </div>
        <!-- Вкладки-минипереключатели -->
        <div class="flex border-b border-slate-700 text-xs font-medium mb-4">
            <button class="border-b-2 border-sky-500 text-sky-400 pb-2 px-2 focus:outline-none">По периодам</button>
            <button class="text-slate-500 pb-2 px-2 cursor-not-allowed focus:outline-none" disabled>По источникам</button>
            <button class="text-slate-500 pb-2 px-2 cursor-not-allowed focus:outline-none" disabled>По типам</button>
        </div>
    </div>

    <!-- Область под нативный локальный график Chart.js -->
    <div class="relative w-full h-40">
        <canvas id="collectionDetailChart"></canvas>
    </div>
</div>

<script>
    (function() {
        const ctx = document.getElementById('collectionDetailChart').getContext('2d');
        new Chart(ctx, {
            type: 'line',
            data: {
                labels: ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'],
                datasets: [{
                    label: 'Объем (ГБ)',
                    // Фильтр tojson преобразует Python-лист [12.4, 15.1, ...] в JS-массив
                    data: {{ chart_data | tojson | safe }},
                    borderColor: '#38bdf8',
                    backgroundColor: 'rgba(56, 189, 248, 0.1)',
                    borderWidth: 2,
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { display: false }, ticks: { color: '#64748b', font: { size: 10 } } },
                    y: { grid: { color: '#334155' }, ticks: { color: '#64748b', font: { size: 10 } } }
                }
            }
        });
    })();
</script>
