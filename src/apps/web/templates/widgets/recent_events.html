<!-- src/apps/web-ui/templates/widgets/recent_events.html -->
<h3 class="text-base font-semibold text-slate-100 mb-4">Последние события системы</h3>
<div class="space-y-4">
    {% for ev in events %}
    <div class="bg-[#0f172a]/40 border border-slate-800 rounded-lg p-3.5 flex items-start space-x-3">
        <span class="text-xs font-mono text-slate-500 mt-0.5">{{ ev.time }}</span>
        <div class="flex-1 min-w-0">
            <div class="flex items-center justify-between mb-1">
                <span class="inline-flex px-1.5 py-0.5 text-[10px] font-bold uppercase rounded bg-{{ ev.badge_color }}-500/10 text-{{ ev.badge_color }}-400">
                    {{ ev.level }}
                </span>
            </div>
            <p class="text-xs text-slate-300 leading-relaxed">{{ ev.msg }}</p>
        </div>
    </div>
    {% endfor %}
</div>
