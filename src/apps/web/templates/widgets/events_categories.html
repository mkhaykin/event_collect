<!-- src/apps/web/templates/widgets/events_categories.html -->
<div class="flex flex-col h-full justify-between"
     id="widget-events-categories"
     hx-get="/components/events-categories"
     hx-trigger="globalFilterChanged from:body"
     hx-target="this"
     hx-swap="outerHTML"
     hx-include="#global-filters">

    <!-- Шапка виджета -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
            <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-base font-semibold text-slate-100">События по категориям</h3>
        </div>

        <!-- ИНТЕРЕЙСНЫЙ ЭЛЕМЕНТ: Контекстное меню "3 точки" на Alpine.js -->
        <div class="relative" x-data="{ open: false }">
            <!-- Кнопка вызова меню -->
            <button @click="open = !open"
                    class="p-1 rounded-lg text-slate-400 hover:text-slate-200 hover:bg-slate-800 transition focus:outline-none">
                <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M12 10c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0-6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 12c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                </svg>
            </button>

            <!-- Выпадающее подменю (Dropdown) -->
            <div x-show="open"
                 @click.outside="open = false"
                 x-transition:enter="transition ease-out duration-100"
                 x-transition:enter-start="transform opacity-0 scale-95"
                 x-transition:enter-end="transform opacity-100 scale-100"
                 x-transition:leave="transition ease-in duration-75"
                 x-transition:leave-start="transform opacity-100 scale-100"
                 x-transition:leave-end="transform opacity-0 scale-95"
                 class="absolute right-0 mt-1 w-44 bg-[#1e293b] border border-slate-700 rounded-lg shadow-xl py-1 z-50 origin-top-right"
                 style="display: none;">

                <!-- Точечное обновление через HTMX -->
                <button hx-get="/components/events-categories"
                        hx-target="#widget-events-categories"
                        hx-swap="outerHTML"
                        @click="open = false"
                        class="w-full text-left px-4 py-2 text-xs text-slate-300 hover:bg-slate-700 hover:text-white transition flex items-center space-x-2">
                    <svg class="w-3.5 h-3.5 text-sky-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.253 8H18"/></svg>
                    <span>Обновить виджет</span>
                </button>

                <a href="/settings" class="block px-4 py-2 text-xs text-slate-400 hover:bg-slate-700 hover:text-white transition flex items-center space-x-2">
                    <svg class="w-3.5 h-3.5 text-slate-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>Настройки</span>
                </a>

                <div class="border-t border-slate-700/50 my-1"></div>

                <button class="w-full text-left px-4 py-2 text-xs text-slate-500 cursor-not-allowed flex items-center space-x-2" disabled>
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    <span>Сбросить кэш</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Область графика и легенды -->
    <div class="grid grid-cols-5 gap-4 items-center flex-1">
        <div class="col-span-2 relative w-full h-36 flex items-center justify-center">
            <canvas id="categoriesPieChart"></canvas>
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-1">
                <span class="text-2xl font-bold tracking-tight text-white leading-none">{{ total_count }}</span>
                <span class="text-[10px] text-slate-400 font-medium uppercase mt-0.5">Всего</span>
            </div>
        </div>
        <div class="col-span-3 space-y-2.5 pl-2">
            {% for item in categories %}
            <div class="flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2.5">
                    <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: {{ item.color }}"></span>
                    <span class="text-slate-300 font-medium">{{ item.label }}</span>
                </div>
                <div class="flex items-center space-x-4 font-mono">
                    <span class="text-white font-semibold w-10 text-right">{{ item.count }}</span>
                    <span class="text-slate-400 w-12 text-right">{{ item.pct }}%</span>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>

<script>
    (function() {
        const ctx = document.getElementById('categoriesPieChart').getContext('2d');
        const colors = {{ categories | map(attribute='color') | list | tojson | safe }};
        const values = {{ categories | map(attribute='count') | list | tojson | safe }};
        new Chart(ctx, {
            type: 'doughnut',
            data: { datasets: [{ data: values, backgroundColor: colors, borderWidth: 0 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false }, tooltip: { enabled: true } }, cutout: '72%' }
        });
    })();
</script>
