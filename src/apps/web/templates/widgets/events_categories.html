<!-- src/apps/web/templates/widgets/events_categories.html -->
<div class="flex flex-col h-full justify-between"
     hx-get="/components/events-categories"
     hx-trigger="globalFilterChanged from:body"
     hx-target="#events-categories-container"
     hx-swap="innerHTML"
     hx-include="#global-filters">

    <!-- Шапка виджета с иконкой и ссылкой -->
    <div class="flex items-center justify-between mb-4">
        <div class="flex items-center space-x-2">
            <!-- Иконка предупреждения (красный треугольник) -->
            <svg class="w-5 h-5 text-rose-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <h3 class="text-base font-semibold text-slate-100">События по категориям</h3>
        </div>
        <a href="/events" class="text-xs font-medium text-sky-400 hover:text-sky-300 flex items-center space-x-1 transition">
            <span>Все события</span>
            <span>→</span>
        </a>
    </div>

    <!-- Основное тело виджета: График слева, Легенда справа -->
    <div class="grid grid-cols-5 gap-4 items-center flex-1">

        <!-- Область графика (Занимает 2 колонки из 5) -->
        <div class="col-span-2 relative w-full h-36 flex items-center justify-center">
            <canvas id="categoriesPieChart"></canvas>

            <!-- Текст строго по центру бублика -->
            <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none mt-1">
                <span class="text-2xl font-bold tracking-tight text-white leading-none">{{ total_count }}</span>
                <span class="text-[10px] text-slate-400 font-medium uppercase mt-0.5">Всего</span>
            </div>
        </div>

        <!-- Кастомная табличная легенда (Занимает 3 колонки из 5) -->
        <div class="col-span-3 space-y-2.5 pl-2">
            {% for item in categories %}
            <div class="flex items-center justify-between text-xs">
                <div class="flex items-center space-x-2.5">
                    <!-- Цветной маркер категории -->
                    <span class="w-3 h-3 rounded-full flex-shrink-0" style="background-color: {{ item.color }}"></span>
                    <span class="text-slate-300 font-medium">{{ item.label }}</span>
                </div>
                <div class="flex items-center space-x-4 font-mono">
                    <span class="text-white font-semibold w-10 text-right">{{ item.count }}</span>
                    <span class="text-slate-400 w-12 text-right">{{ item.pct }}%</span>
                </div>
            </div>
            {% endfor %}
        </div>

    </div>
</div>

<script>
    (function() {
        const ctx = document.getElementById('categoriesPieChart').getContext('2d');

        // Извлекаем цвета напрямую из структуры данных Python для синхронизации с HTML
        const colors = {{ categories | map(attribute='color') | list | tojson | safe }};
        const values = {{ categories | map(attribute='count') | list | tojson | safe }};

        new Chart(ctx, {
            type: 'doughnut',
            data: {
                datasets: [{
                    data: values,
                    backgroundColor: colors,
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    // Полностью отключаем дефолтную легенду Chart.js
                    legend: { display: false },
                    tooltip: { enabled: true }
                },
                // Толщина бублика
                cutout: '72%'
            }
        });
    })();
</script>
