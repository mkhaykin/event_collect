<!-- src/apps/web_ui/templates/widgets/events_categories.html -->
<div class="flex flex-col h-full justify-between">
    <h3 class="text-base font-semibold text-slate-100 mb-4">События по категориям</h3>
    <div class="relative w-full h-44 flex items-center justify-center">
        <canvas id="categoriesPieChart"></canvas>
    </div>
</div>

<script>
    (function() {
        const ctx = document.getElementById('categoriesPieChart').getContext('2d');
        new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Security', 'System', 'Application'],
                datasets: [{
                    // Передаем веса категорий (например, [65, 25, 10]) из контекста Python
                    data: {{ categories_data | tojson | safe }},
                    backgroundColor: ['#f43f5e', '#38bdf8', '#fbbf24'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#94a3b8', font: { size: 11 } }
                    }
                },
                cutout: '70%'
            }
        });
    })();
</script>
